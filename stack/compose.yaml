name: pdi

services:

  traefik:
    image: traefik:v3.6
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --providers.docker.network=pdi_proxy
      - --entrypoints.websecure.address=:443                                    # NOVO
      - --entrypoints.web.http.redirections.entrypoint.to=websecure             # NOVO
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}                     # NOVO
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json          # NOVO
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web            # NOVO
      - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory  # NOVO (tirar no Dia 10)
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure                    # NOVO
      - traefik.http.routers.dashboard.tls.certresolver=le                      # NOVO
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}  
    networks: [proxy]  
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  postgres:
    image: postgres:16
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    networks: [proxy]
    environment:
      APP_MESSAGE: ${APP_MESSAGE}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`gw.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure                          # NOVO
      - traefik.http.routers.api.tls.certresolver=le                            # NOVO
      - traefik.http.routers.api.middlewares=api-strip,api-limit
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.middlewares.api-limit.ratelimit.average=10
      - traefik.http.middlewares.api-limit.ratelimit.burst=20
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/
      - traefik.http.services.api.loadbalancer.healthcheck.interval=10s  
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.42.7
    networks: [proxy, backend]   
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: ${PROTOCOL}
      WEBHOOK_URL: ${PROTOCOL}://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure                          # NOVO
      - traefik.http.routers.n8n.tls.certresolver=le                            # NOVO
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    restart: unless-stopped    

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    networks: [proxy, backend]   
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${PROTOCOL}://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure                     # NOVO
      - traefik.http.routers.keycloak.tls.certresolver=le                       # NOVO
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    restart: unless-stopped 

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    networks: [proxy, backend]   
    environment:
      SERVER_URL: ${PROTOCOL}://wpp.${DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.evolution.rule=Host(`wpp.${DOMAIN}`)
      - traefik.http.routers.evolution.entrypoints=websecure                    # NOVO
      - traefik.http.routers.evolution.tls.certresolver=le                      # NOVO
      - traefik.http.services.evolution.loadbalancer.server.port=8080
    restart: unless-stopped     

  redis:
    image: redis:7-alpine
    networks: [backend]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    
volumes:
  pgdata:
  evolution_instances:
  letsencrypt:

networks:
  proxy:
  backend:  

