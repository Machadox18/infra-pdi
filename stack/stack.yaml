services:

  traefik:
    image: traefik:v3.6
    command:
      - --api.dashboard=true
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=pdi_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.tls.certresolver=le
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=dashboard-auth
        - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
        - traefik.http.services.dashboard.loadbalancer.server.port=8080

  postgres:
    image: postgres:16
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /opt/pdi/repo/stack/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    deploy:
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    networks: [backend]
    command: redis-server --requirepass ${REDIS_PASSWORD}

  api:
    image: ghcr.io/machadox18/pdi-api:1.0
    networks: [proxy]
    environment:
      APP_MESSAGE: ${APP_MESSAGE}
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=Host(`gw.${DOMAIN}`) && PathPrefix(`/api`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls.certresolver=le
        - traefik.http.routers.api.middlewares=api-strip,api-limit
        - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
        - traefik.http.middlewares.api-limit.ratelimit.average=10
        - traefik.http.middlewares.api-limit.ratelimit.burst=20
        - traefik.http.services.api.loadbalancer.server.port=8000

  n8n:
    image: n8nio/n8n:2.42.7
    networks: [proxy, backend]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: ${PROTOCOL}
      WEBHOOK_URL: ${PROTOCOL}://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
        - traefik.http.routers.n8n.entrypoints=websecure
        - traefik.http.routers.n8n.tls.certresolver=le
        - traefik.http.services.n8n.loadbalancer.server.port=5678

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    networks: [proxy, backend]
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${PROTOCOL}://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
        - traefik.http.routers.keycloak.entrypoints=websecure
        - traefik.http.routers.keycloak.tls.certresolver=le
        - traefik.http.services.keycloak.loadbalancer.server.port=8080

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    networks: [proxy, backend]
    environment:
      SERVER_URL: ${PROTOCOL}://wpp.${DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.evolution.rule=Host(`wpp.${DOMAIN}`)
        - traefik.http.routers.evolution.entrypoints=websecure
        - traefik.http.routers.evolution.tls.certresolver=le
        - traefik.http.services.evolution.loadbalancer.server.port=8080

volumes:
  pgdata:
  evolution_instances:
  letsencrypt:

networks:
  proxy:
    driver: overlay
  backend:
    driver: overlay